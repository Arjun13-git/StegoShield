[project]
name = "stegoshield"
version = "0.1.0"
description = "Explainable ML-based image steganalysis platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.8,<3",
  "pillow>=10,<12",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
